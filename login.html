<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — CESUCAR</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <main class="auth-shell">
    <section class="auth-card login-card">
      <a href="index.html" class="auth-logo" aria-label="Página inicial">
        <img src="logo.png" alt="CESUCAR" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <span class="navbar-logo-fallback">CESUCAR</span>
      </a>

      <h1 class="login-title">Bem-vindo de volta</h1>
      <p class="login-sub">Entre com sua conta para acessar reservas, rotas e notificações.</p>

      <form class="login-form" id="loginForm" onsubmit="handleLogin(event)" novalidate>
        <div class="divider-row"><span>credenciais</span></div>

        <div class="form-group">
          <label class="form-label" for="rgm">RGM <span class="req">*</span></label>
          <input
            class="form-input"
            type="text"
            id="rgm"
            placeholder="00000000"
            inputmode="numeric"
            maxlength="8"
            autocomplete="username"
            required
          />
          <span class="form-hint">8 dígitos numéricos — sem letras ou espaços.</span>
          <span class="form-error" id="err-rgm"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha <span class="req">*</span></label>
          <div class="input-eye">
            <input
              class="form-input"
              type="password"
              id="password"
              placeholder="Sua senha"
              autocomplete="current-password"
              required
            />
            <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePwd()" aria-label="Mostrar senha">◐</button>
          </div>
          <span class="form-error" id="err-pw"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Entrar</button>

        <div class="signup-row">Não tem conta? <a href="cadastro.html">Cadastre-se grátis</a></div>
      </form>
    </section>

    <p class="signup-row">
      <a href="index.html">Voltar ao início</a>
    </p>
  </main>

  <script src="js/app.js?v=20260613d"></script>
  <script>
    if (CESUCAR.isLoggedIn()) window.location.href = "dashboard.html";

    document.getElementById("rgm").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 8);
      document.getElementById("err-rgm").textContent = "";
    });

    function togglePwd() {
      const input = document.getElementById("password");
      const btn = document.getElementById("eyeBtn");
      const visible = input.type === "text";
      input.type = visible ? "password" : "text";
      btn.textContent = visible ? "◐" : "●";
      btn.setAttribute("aria-label", visible ? "Mostrar senha" : "Ocultar senha");
    }

    async function handleLogin(event) {
      event.preventDefault();
      document.getElementById("err-rgm").textContent = "";
      document.getElementById("err-pw").textContent = "";

      const btn = document.getElementById("loginBtn");
      const rgm = document.getElementById("rgm").value.trim();
      const password = document.getElementById("password").value;

      if (!rgm) {
        document.getElementById("err-rgm").textContent = "Informe seu RGM.";
        document.getElementById("rgm").focus();
        return;
      }
      if (!/^\d{8}$/.test(rgm)) {
        document.getElementById("err-rgm").textContent = "RGM deve conter exatamente 8 dígitos numéricos.";
        document.getElementById("rgm").focus();
        return;
      }
      if (!password) {
        document.getElementById("err-pw").textContent = "Informe sua senha.";
        document.getElementById("password").focus();
        return;
      }

      CESUCAR.showLoading(btn, "Verificando...");
      const result = await CESUCAR.login(rgm, password);
      CESUCAR.hideLoading(btn);

      if (!result.ok) {
        document.getElementById("err-pw").textContent = result.error;
        CESUCAR.toast(result.error, "error");
        return;
      }

      btn.textContent = "Entrada confirmada";
      CESUCAR.toast("Login realizado. Redirecionando...", "success", 1500);
      setTimeout(() => window.location.href = "dashboard.html", 900);
    }
  </script>
</body>
</html>
