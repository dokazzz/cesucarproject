<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro — CESUCAR</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <main class="cad-wrap">
    <section class="auth-card cad-card">
      <a href="index.html" class="auth-logo" aria-label="Página inicial">
        <img src="logo.png" alt="CESUCAR" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
        <span class="navbar-logo-fallback">CESUCAR</span>
      </a>

      <h1 class="cad-title">Crie sua conta</h1>
      <p class="cad-sub">Organize suas caronas e acompanhe tudo em um só lugar.</p>

      <div class="steps-bar" aria-label="Etapas do cadastro">
        <div class="step-dot active" id="sd1"></div>
        <div class="step-dot" id="sd2"></div>
        <div class="step-dot" id="sd3"></div>
      </div>

      <form id="cadForm" onsubmit="handleCad(event)" novalidate>

        <!-- Etapa 1: Dados pessoais + perfil -->
        <section class="form-step" id="step1">
          <!-- Seletor de perfil -->
          <div class="form-group">
            <label class="form-label">Você é <span class="req">*</span></label>
            <div class="role-selector">
              <label class="role-option" id="role-passageiro">
                <input type="radio" name="perfil" value="passageiro" checked />
                <span class="role-icon">🎓</span>
                <span class="role-label">Passageiro</span>
                <span class="role-desc">Procuro caronas</span>
              </label>
              <label class="role-option" id="role-motorista">
                <input type="radio" name="perfil" value="motorista" />
                <span class="role-icon">🚗</span>
                <span class="role-label">Motorista</span>
                <span class="role-desc">Ofereço caronas</span>
              </label>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="nome">Nome <span class="req">*</span></label>
              <input class="form-input" type="text" id="nome" placeholder="Seu nome completo" autocomplete="name" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="curso">Curso <span class="req">*</span></label>
              <select class="form-select" id="curso" required>
                <option value="">Selecione</option>
                <option>Administração</option>
                <option>Ciência da Computação</option>
                <option>Direito</option>
                <option>Engenharia de Software</option>
                <option>Sistemas de Informação</option>
                <option>Pedagogia</option>
                <option>Psicologia</option>
                <option>Enfermagem</option>
                <option>Outro</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="cidade">Cidade <span class="req">*</span></label>
            <select class="form-select" id="cidade" required>
              <option value="">Selecione sua cidade</option>
              <option>Cachoeirinha</option>
              <option>Gravataí</option>
              <option>Canoas</option>
              <option>Alvorada</option>
              <option>Porto Alegre</option>
              <option>Viamão</option>
              <option>Sapucaia do Sul</option>
              <option>São Leopoldo</option>
              <option>Outra</option>
            </select>
          </div>

          <button type="button" class="btn btn-blue btn-block" onclick="nextStep(2)">Continuar</button>
        </section>

        <!-- Etapa 2: RGM e Contato -->
        <section class="form-step" id="step2" hidden>
          <div class="form-group">
            <label class="form-label" for="rgm">RGM <span class="req">*</span></label>
            <input class="form-input" type="text" id="rgm" placeholder="00000000" inputmode="numeric" maxlength="8" autocomplete="username" required />
            <span class="form-hint">Registro Geral de Matrícula — exatamente 8 dígitos numéricos.</span>
            <span class="form-error" id="err-rgm"></span>
          </div>

          <div class="form-group">
            <label class="form-label" for="telefone">Telefone <span class="req">*</span></label>
            <input class="form-input" type="tel" id="telefone" placeholder="(51) 99999-0000" maxlength="15" required />
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-ghost" onclick="prevStep(1)">Voltar</button>
            <button type="button" class="btn btn-blue" onclick="nextStep(3)">Continuar</button>
          </div>
        </section>

        <!-- Etapa 3: Senha -->
        <section class="form-step" id="step3" hidden>
          <div class="form-group">
            <label class="form-label" for="senha">Senha <span class="req">*</span></label>
            <input class="form-input" type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6" />
            <div class="password-strength">
              <div class="step-dot" id="sb1"></div>
              <div class="step-dot" id="sb2"></div>
              <div class="step-dot" id="sb3"></div>
              <div class="step-dot" id="sb4"></div>
            </div>
            <span class="form-hint" id="strength-label">Digite a senha</span>
          </div>

          <div class="form-group">
            <label class="form-label" for="senha2">Confirmar senha <span class="req">*</span></label>
            <input class="form-input" type="password" id="senha2" placeholder="Repita a senha" required />
            <span class="form-error" id="err-senha2"></span>
          </div>

          <div class="terms-row">
            <input type="checkbox" id="terms" required />
            <label for="terms">Concordo com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>.</label>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-ghost" onclick="prevStep(2)">Voltar</button>
            <button type="submit" class="btn btn-primary" id="cadBtn">Criar conta</button>
          </div>
        </section>
      </form>

      <div class="login-row mt-18">Já tem conta? <a href="login.html">Entrar</a></div>
    </section>

    <p class="signup-row">
      <a href="index.html">Voltar ao início</a>
    </p>
  </main>

  <script src="js/app.js"></script>
  <script>
    let currentStep = 1;

    // Destaque visual ao selecionar perfil
    document.querySelectorAll('input[name="perfil"]').forEach((radio) => {
      radio.addEventListener("change", () => {
        document.querySelectorAll(".role-option").forEach((el) => el.classList.remove("selected"));
        radio.closest(".role-option").classList.add("selected");
      });
    });
    document.querySelector('input[name="perfil"]:checked')
      ?.closest(".role-option")
      ?.classList.add("selected");

    function setStep(next) {
      document.getElementById("step" + currentStep).hidden = true;
      document.getElementById("sd" + currentStep).classList.remove("active");
      currentStep = next;
      document.getElementById("step" + currentStep).hidden = false;
      document.getElementById("sd" + currentStep).classList.add("active");

      for (let index = 1; index <= 3; index += 1) {
        const dot = document.getElementById("sd" + index);
        dot.classList.toggle("done", index < currentStep);
      }
    }

    function nextStep(step) {
      if (step === 2) {
        if (!document.getElementById("nome").value.trim()) return CESUCAR.toast("Informe seu nome.", "error");
        if (!document.getElementById("curso").value) return CESUCAR.toast("Selecione seu curso.", "error");
        if (!document.getElementById("cidade").value) return CESUCAR.toast("Selecione sua cidade.", "error");
      }

      if (step === 3) {
        const rgm = document.getElementById("rgm").value.trim();
        const phone = document.getElementById("telefone").value.trim();
        const errRgm = document.getElementById("err-rgm");
        errRgm.textContent = "";
        if (!rgm || !/^\d{8}$/.test(rgm)) {
          errRgm.textContent = "O RGM deve conter exatamente 8 dígitos numéricos.";
          document.getElementById("rgm").focus();
          return;
        }
        if (!phone || phone.length < 14) return CESUCAR.toast("Informe um telefone válido.", "error");
      }

      setStep(step);
    }

    function prevStep(step) {
      setStep(step);
    }

    // Filtro: apenas dígitos no campo RGM
    document.getElementById("rgm").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "").slice(0, 8);
      document.getElementById("err-rgm").textContent = "";
    });

    document.getElementById("telefone").addEventListener("input", function () {
      let value = this.value.replace(/\D/g, "");
      if (value.length <= 10) value = value.replace(/(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
      else value = value.replace(/(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
      this.value = value.trim().replace(/-$/, "");
    });

    document.getElementById("senha").addEventListener("input", function () {
      const value = this.value;
      let score = 0;
      if (value.length >= 6) score += 1;
      if (value.length >= 10) score += 1;
      if (/[A-Z]/.test(value) && /[0-9]/.test(value)) score += 1;
      if (/[^A-Za-z0-9]/.test(value)) score += 1;

      const colors = ["#dc4c4c", "#f4b942", "#2f9e83", "#167a65"];
      const labels = ["fraca", "razoável", "boa", "forte"];

      for (let index = 1; index <= 4; index += 1) {
        document.getElementById("sb" + index).style.background =
          index <= score ? colors[score - 1] : "var(--glass-border)";
      }

      document.getElementById("strength-label").textContent = score ? "Senha " + labels[score - 1] : "Digite a senha";
    });

    async function handleCad(event) {
      event.preventDefault();
      const password = document.getElementById("senha").value;
      const confirm = document.getElementById("senha2").value;
      const error = document.getElementById("err-senha2");
      error.textContent = "";

      if (password.length < 6) return CESUCAR.toast("A senha precisa ter pelo menos 6 caracteres.", "error");
      if (password !== confirm) {
        error.textContent = "As senhas não coincidem.";
        return;
      }
      if (!document.getElementById("terms").checked) return CESUCAR.toast("Aceite os termos para continuar.", "error");

      const button = document.getElementById("cadBtn");
      CESUCAR.showLoading(button, "Criando conta...");
      await new Promise((resolve) => setTimeout(resolve, 800));

      const name = document.getElementById("nome").value.trim();
      const rgm = document.getElementById("rgm").value.trim();
      const perfil = document.querySelector('input[name="perfil"]:checked')?.value || "passageiro";

      const userData = {
        id: Date.now(),
        name,
        rgm,
        password,
        curso: document.getElementById("curso").value,
        cidade: document.getElementById("cidade").value,
        telefone: document.getElementById("telefone").value,
        avatar: CESUCAR.initials(name),
        rating: "5.0",
        trips: 0,
        perfil,
        role: "both"
      };

      const result = CESUCAR.register(userData);
      CESUCAR.hideLoading(button);

      if (!result.ok) {
        CESUCAR.toast(result.error, "error");
        // Volta para etapa 2 para corrigir o RGM
        setStep(2);
        document.getElementById("err-rgm").textContent = result.error;
        return;
      }

      button.textContent = "Conta criada";
      CESUCAR.toast(`Bem-vindo, ${name.split(" ")[0]}! Conta criada como ${perfil}.`, "success", 2000);
      setTimeout(() => window.location.href = "dashboard.html", 1100);
    }
  </script>
</body>
</html>
