<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procurar carona — CESUCAR</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="app-page">
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <nav class="navbar">
    <a href="index.html" class="navbar-logo">
      <img src="logo.png" alt="CESUCAR" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <span class="navbar-logo-fallback">CESUCAR</span>
    </a>
    <ul class="navbar-links" id="navLinks"></ul>
    <div class="navbar-right">
      <div class="theme-toggle"></div>
      <div id="navAuthArea"></div>
      <button class="hamburger" id="hamburger" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-drawer" id="mobileDrawer"></div>

  <main class="page-body">
    <header class="page-head reveal">
      <div class="section-tag">Procurar</div>
      <h1 class="page-title">Encontre sua <span class="accent">carona ideal</span></h1>
      <p>Filtre por cidade, horário e tipo de viagem para chegar ao CESUCA.</p>
    </header>

    <section class="search-panel reveal" aria-label="Filtros de busca">
      <div class="search-row">
        <div class="form-group">
          <label class="form-label" id="labelCidade" for="f-cidade">Sua cidade</label>
          <select class="form-select" id="f-cidade">
            <option value="">Qualquer cidade</option>
            <option>Cachoeirinha</option>
            <option>Gravataí</option>
            <option>Canoas</option>
            <option>Alvorada</option>
            <option>Porto Alegre</option>
            <option>Viamão</option>
            <option>Sapucaia do Sul</option>
            <option>São Leopoldo</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-data">Data</label>
          <input class="form-input" type="date" id="f-data" />
        </div>
        <div class="form-group">
          <label class="form-label" for="f-horario">Horário</label>
          <select class="form-select" id="f-horario">
            <option value="">Qualquer</option>
            <option value="manha">Manhã (06–12h)</option>
            <option value="tarde">Tarde (12–18h)</option>
            <option value="noite">Noite (18–23h)</option>
          </select>
        </div>
        <div class="form-group" style="align-self:flex-end;">
          <button class="btn btn-primary" style="width:100%;" onclick="doSearch()">Buscar</button>
        </div>
      </div>

      <div class="filter-row" role="group" aria-label="Filtros rápidos">
        <span class="form-label" style="align-self:center;">Filtros</span>
        <button class="filter-chip active" type="button" onclick="toggleChip(this,'all')">Todos</button>
        <button class="filter-chip" type="button" onclick="toggleChip(this,'vagas')">Com vagas</button>
        <button class="filter-chip" type="button" onclick="toggleChip(this,'barato')">Mais barato</button>
      </div>

      <div class="filter-row" role="group" aria-label="Tipo de viagem">
        <span class="form-label" style="align-self:center;">Viagem</span>
        <button class="filter-chip tipo-chip active" type="button" data-tipo="todos" onclick="toggleTipo(this,'todos')">⇄ Todos</button>
        <button class="filter-chip tipo-chip" type="button" data-tipo="ida" onclick="toggleTipo(this,'ida')">→ Ida para o CESUCA</button>
        <button class="filter-chip tipo-chip" type="button" data-tipo="volta" onclick="toggleTipo(this,'volta')">← Volta do CESUCA</button>
      </div>
    </section>

    <div class="results-header reveal">
      <div class="results-count" id="resultsCount">Buscando caronas…</div>
      <select class="form-select" id="sortBy" onchange="doSearch()" style="width:auto;min-width:170px;" aria-label="Ordenar resultados">
        <option value="horario">Ordenar por horário</option>
        <option value="preco">Menor preço</option>
      </select>
    </div>

    <section id="resultsList" aria-live="polite" aria-label="Resultados de caronas"></section>
  </main>

  <footer class="site-footer">
    <div class="footer-bottom">
      <span>© 2026 CESUCAR — Centro Universitário CESUCA</span>
      <nav class="footer-nav">
        <a href="index.html">Início</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="procurar-carona.html">Caronas</a>
        <a href="oferecer-carona.html">Oferecer carona</a>
      </nav>
    </div>
  </footer>

  <script src="js/app.js?v=20260613d"></script>
  <script>
    CESUCAR.requireAuth();
    CESUCAR.setupNav("search");

    document.getElementById("f-data").value = CESUCAR.today;

    // Pre-fill from URL params
    const params = new URLSearchParams(window.location.search);
    if (params.get("departure_city")) document.getElementById("f-cidade").value = params.get("departure_city");
    if (params.get("cidade")) document.getElementById("f-cidade").value = params.get("cidade");
    if (params.get("data")) document.getElementById("f-data").value = params.get("data");
    if (params.get("tipo")) activarTipo(params.get("tipo"));

    let activeFilter = "all";
    let activeTipo = "todos";

    function activarTipo(tipo) {
      document.querySelectorAll(".tipo-chip").forEach(c => c.classList.remove("active"));
      const btn = document.querySelector(`.tipo-chip[data-tipo="${tipo}"]`);
      if (btn) btn.classList.add("active");
      activeTipo = tipo;
      atualizarLabelCidade();
    }

    function toggleChip(el, type) {
      document.querySelectorAll(".filter-chip:not(.tipo-chip)").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      activeFilter = type;
      doSearch();
    }

    function toggleTipo(el, tipo) {
      document.querySelectorAll(".tipo-chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      activeTipo = tipo;
      atualizarLabelCidade();
      doSearch();
    }

    function atualizarLabelCidade() {
      const lbl = document.getElementById("labelCidade");
      if (!lbl) return;
      if (activeTipo === "ida") lbl.textContent = "Cidade de origem";
      else if (activeTipo === "volta") lbl.textContent = "Cidade de destino";
      else lbl.textContent = "Sua cidade";
    }

    function tipoBadge(tipo) {
      return tipo === "ida"
        ? `<span class="badge badge-ida">→ Ida</span>`
        : `<span class="badge badge-volta">← Volta</span>`;
    }

    async function doSearch() {
      document.getElementById("resultsCount").textContent = "Buscando caronas…";
      const cidade = document.getElementById("f-cidade").value;
      const data = document.getElementById("f-data").value;
      const horario = document.getElementById("f-horario").value;
      const sort = document.getElementById("sortBy").value;

      const filters = {
        data: data || undefined,
        tipo: activeTipo !== "todos" ? activeTipo : undefined,
      };
      if (cidade) filters.cidade = cidade;

      let rides = await CESUCAR.getRides(filters);

      // Client-side time filter
      if (horario === "manha") rides = rides.filter(r => { const h = +(r.horario || "").slice(0,2); return h >= 6 && h < 12; });
      if (horario === "tarde") rides = rides.filter(r => { const h = +(r.horario || "").slice(0,2); return h >= 12 && h < 18; });
      if (horario === "noite") rides = rides.filter(r => { const h = +(r.horario || "").slice(0,2); return h >= 18; });

      const seatsField = r => r.vagasDisp ?? r.vagas_disp ?? r.available_seats ?? 0;
      if (activeFilter === "vagas") rides = rides.filter(r => seatsField(r) > 0);
      if (activeFilter === "barato") rides.sort((a, b) => (a.valor ?? a.price_per_passenger) - (b.valor ?? b.price_per_passenger));
      if (sort === "preco") rides.sort((a, b) => (a.valor ?? a.price_per_passenger) - (b.valor ?? b.price_per_passenger));

      _lastRides = rides; // cache for WhatsApp lookup

      document.getElementById("resultsCount").textContent =
        `${rides.length} carona${rides.length !== 1 ? "s" : ""} encontrada${rides.length !== 1 ? "s" : ""}`;

      renderResults(rides);
    }

    async function renderResults(rides) {
      const container = document.getElementById("resultsList");
      const myRequests = CESUCAR.isLoggedIn() ? await CESUCAR.getMyRequests() : [];
      const myReqMap = {};
      myRequests.forEach(req => {
        const rid = req.ride_id || req.rideId;
        if (rid) myReqMap[rid] = req;
      });

      if (!rides.length) {
        container.innerHTML = `<div class="empty-state"><span class="empty-state-icon">⌕</span><div class="empty-state-title">Nenhuma carona encontrada</div><p>Ajuste os filtros ou <a href="oferecer-carona.html" class="ec-link">ofereça uma carona</a>.</p></div>`;
        return;
      }

      container.innerHTML = rides.map(r => {
        const myReq  = myReqMap[r.id];
        const status = myReq?.status;
        const isPending  = status === "PENDING";
        const isApproved = status === "APPROVED";
        const reserved   = isPending || isApproved;
        const seats  = r.vagasDisp ?? r.vagas_disp ?? r.available_seats ?? 0;
        const esgotado = seats <= 0 && !reserved;
        const valor = r.valor ?? r.price_per_passenger;
        const actionHtml = isPending
          ? `<span class="badge badge-orange">Aguardando</span>
             <button class="btn btn-ghost btn-sm btn-cancel" onclick="cancelRes('${r.id}')">Cancelar</button>`
          : isApproved
            ? `<button class="btn btn-primary btn-sm" onclick="contactDriver('${r.id}')">Confirmar</button>
               <button class="btn btn-ghost btn-sm btn-cancel" onclick="cancelRes('${r.id}')">Cancelar</button>`
            : esgotado
              ? `<span class="badge badge-gray">Esgotado</span>`
              : `<button class="btn btn-primary btn-sm" onclick="reservar('${r.id}')">Reservar vaga</button>`;
        const vehicleInfo = r.driver_vehicle_brand
          ? `${r.driver_vehicle_brand} ${r.driver_vehicle_model || ""} ${r.driver_vehicle_color ? "· " + r.driver_vehicle_color : ""}`.trim()
          : (r.veiculo || r.vehicle || "");
        return `
          <article class="driver-card reveal" data-ride-id="${r.id}">
            <div class="driver-card-avatar">
              <div class="avatar avatar-md">${r.driver_avatar || r.driverAvatar || "CE"}</div>
            </div>
            <div class="driver-details">
              <div class="driver-name">${r.driver || "Motorista"}</div>
              <div class="driver-curso">${r.course || r.curso || ""}</div>
              <div class="driver-route">
                <span class="route-city">${r.origem || r.departure_city}</span>
                <span class="route-arrow">→</span>
                <span class="route-city">${r.destino || r.destination}</span>
                <span class="route-time">· ${r.horario || ""}</span>
              </div>
              <div class="driver-tags">
                <span class="badge badge-gray">${r.data || ""}</span>
                ${r.neighborhood ? `<span class="badge badge-gray">📍 ${r.neighborhood}</span>` : ""}
                ${vehicleInfo ? `<span class="badge badge-blue">${vehicleInfo}</span>` : ""}
                ${r.placa || r.license_plate ? `<span class="badge badge-placa">${r.placa || r.license_plate}</span>` : ""}
                <span class="badge ${seats > 0 ? 'badge-gray' : 'badge-red'}">${seats > 0 ? `${seats} vaga${seats !== 1 ? 's' : ''} disponível` : 'Esgotado'}</span>
                ${tipoBadge(r.tipo || "ida")}
              </div>
            </div>
            <div class="driver-actions">
              <div class="driver-price">
                <div class="price-big">R$${CESUCAR.fmt(valor)}</div>
                <div class="price-sub">por pessoa</div>
              </div>
              <div class="driver-btns">${actionHtml}</div>
            </div>
          </article>`;
      }).join("");

      requestAnimationFrame(() => {
        container.querySelectorAll(".reveal").forEach((el, i) => {
          setTimeout(() => el.classList.add("visible"), i * 55);
        });
      });
    }

    // Cache rides from last search for WhatsApp lookup
    let _lastRides = [];

    async function reservar(id) {
      if (!CESUCAR.isLoggedIn()) {
        CESUCAR.modal({
          icon: "→",
          title: "Entre para reservar",
          body: "Faça login para confirmar sua vaga e acompanhar a reserva pelo dashboard.",
          confirmLabel: "Ir para login",
          onConfirm: () => { window.location.href = "login.html"; }
        });
        return;
      }
      const ride = _lastRides.find(r => r.id === id);
      if (!ride) return;
      const driverVehicle = ride.driver_vehicle_brand
        ? `${ride.driver_vehicle_brand} ${ride.driver_vehicle_model || ""} ${ride.driver_vehicle_color ? "· " + ride.driver_vehicle_color : ""}`.trim()
        : (ride.veiculo || ride.vehicle || "");
      CESUCAR.modal({
        icon: "✓",
        title: "Confirmar reserva",
        body: `
          <strong>${ride.driver || "Motorista"}</strong><br>
          ${ride.origem} → ${ride.destino} às <strong>${ride.horario}</strong><br>
          Tipo: <strong>${ride.tipo === "ida" ? "Ida para o CESUCA" : "Volta do CESUCA"}</strong><br>
          ${ride.neighborhood ? `Bairro: <strong>${ride.neighborhood}</strong><br>` : ""}
          ${driverVehicle ? `Veículo: <strong>${driverVehicle}</strong><br>` : ""}
          <br>Valor: <strong>R$${CESUCAR.fmt(ride.valor ?? ride.price_per_passenger)}</strong> por pessoa`,
        confirmLabel: "Confirmar",
        onConfirm: async () => {
          const result = await CESUCAR.reserveRide(id, ride);
          result.ok ? doSearch() : CESUCAR.toast(result.error, "error");
        }
      });
    }

    async function cancelRes(id) {
      CESUCAR.modal({
        icon: "!",
        title: "Cancelar reserva",
        body: "Deseja cancelar esta reserva?",
        confirmLabel: "Cancelar reserva",
        onConfirm: async () => { await CESUCAR.cancelReservation(id); doSearch(); }
      });
    }

    function contactDriver(rideId) {
      const ride = _lastRides.find(r => r.id === rideId);
      if (!ride || !ride.driver_phone) return CESUCAR.toast("Motorista não informou telefone.", "info");
      CESUCAR.openWhatsApp(ride.driver_phone, ride, CESUCAR.currentUser());
    }

    doSearch();
  </script>
</body>
</html>
